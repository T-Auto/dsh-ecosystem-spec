<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dsh-ecosystem-spec logo preview</title>
  <style>
    :root {
      --page-bg: #f4f6fb;
      --card-bg: #ffffff;
      --wordmark: #263146;
      --descriptor: #687386;
      --rule: #abc2ec;
      --shadow: 0 24px 60px rgba(23, 37, 84, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0b1220;
        --card-bg: #111827;
        --wordmark: #e8e6e0;
        --descriptor: #abc2ec;
        --rule: #5e88cc;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--wordmark);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .stage {
      width: min(96vw, 840px);
      padding: 32px 16px;
    }

    .caption {
      margin: 0 0 14px 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--descriptor);
      opacity: 0.9;
    }

    .logo-card {
      background: var(--card-bg);
      border: 1px solid rgba(75, 111, 255, 0.16);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      overflow: hidden;
    }

    /* --- pixel art icon (pure HTML/CSS grid, no SVG) --- */
    .pixel-icon {
      flex: 0 0 auto;
      width: 240px;
      height: 176px;
      display: grid;
      grid-template-columns: repeat(30, 8px);
      grid-template-rows: repeat(22, 8px);
      image-rendering: pixelated;
    }
    .pixel {
      width: 8px;
      height: 8px;
    }

    /* --- wordmark --- */
    .logo-text {
      min-width: 0;
      flex: 1 1 auto;
    }
    .wordmark {
      margin: 0;
      font-size: 46px;
      line-height: 1.05;
      font-weight: 750;
      letter-spacing: -0.015em;
      white-space: nowrap;
      color: var(--wordmark);
    }
    .wordmark .brand {
      color: #4b6fff;
    }
    .rule {
      height: 2px;
      margin: 12px 0 10px;
      background: var(--rule);
      border-radius: 2px;
    }
    .descriptor {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--descriptor);
      white-space: nowrap;
    }

    @media (max-width: 680px) {
      .logo-card {
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }
      .logo-text {
        width: 100%;
      }
      .wordmark,
      .descriptor {
        white-space: normal;
        overflow-wrap: anywhere;
      }
    }

    .note {
      margin: 14px 2px 0;
      font-size: 12px;
      color: var(--descriptor);
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="caption">dsh ecosystem spec · logo preview · html/css</p>

    <div class="logo-card" role="img" aria-label="dsh-ecosystem-spec logo">
      <div class="pixel-icon" id="pixel-icon" aria-hidden="true"></div>
      <div class="logo-text">
        <h1 class="wordmark"><span class="brand">dsh</span>-ecosystem-spec</h1>
        <div class="rule"></div>
        <p class="descriptor">DEEPSEEK HARNESS ECOSYSTEM SPECIFICATION</p>
      </div>
    </div>

    <p class="note">
      与 dsh-TUI 同款像素风：四个角落节点已改为中心对称（仅正中单点高亮），蓝色系与暗色模式自适应。
    </p>
  </main>

  <script>
    // 30 x 22 pixel map: 4 corners are now centered-symmetric 5x5 blocks (#BBB# / #BLB# / #BBB#)
    const MAP = [
      "..............................",
      ".#####..................#####.",
      ".#BBB#..................#BBB#.",
      ".#BLB#..................#BLB#.",
      ".#BBB#.........A........#BBB#.",
      ".#####...A.....#.....A..#####.",
      "..........A...#B#...A.........",
      "...........A.#BBB#.A..........",
      "............ABBLBBA...........",
      "...........#BALLLAB#..........",
      "..........#BBLAWALBB#.........",
      ".......AA#BBLLWWLLLBB#AA......",
      "..........#BBLALALBB#.........",
      "...........#BALLLAB#..........",
      "............ABBLBBA...........",
      "...........A.#BBB#.A..........",
      ".#####....A...#B#...A...#####.",
      ".#BBB#...A.....#.....A..#BBB#.",
      ".#BLB#.........A........#BLB#.",
      ".#BBB#.........A........#BBB#.",
      ".#####..................#####.",
      ".............................."
    ];
    const COLORS = {
      "#": "#172554",
      "B": "#4b6fff",
      "L": "#b9dcff",
      "W": "#ffffff",
      "A": "#7da1de"
    };

    const icon = document.getElementById("pixel-icon");
    const fragment = document.createDocumentFragment();

    MAP.forEach((row, y) => {
      [...row].forEach((ch, x) => {
        if (ch === ".") return;
        const cell = document.createElement("div");
        cell.className = "pixel";
        cell.style.gridColumn = String(x + 1);
        cell.style.gridRow = String(y + 1);
        cell.style.background = COLORS[ch];
        fragment.appendChild(cell);
      });
    });

    icon.appendChild(fragment);
  </script>
</body>
</html>
